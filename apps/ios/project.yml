name: MiniMasque
options:
  bundleIdPrefix: io.github.minimasque
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  MiniMasque:
    type: application
    platform: iOS
    sources:
      - MiniMasque
      - Generated/masque_ffi.swift
    dependencies:
      - framework: Generated/MasqueFFI.xcframework
        embed: false
    info:
      path: MiniMasque/Info.plist
      properties:
        CFBundleDisplayName: MiniMASQUE
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.minimasque
        CODE_SIGNING_ALLOWED: NO
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

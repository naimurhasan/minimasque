[package]
name = "masque-client"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
bytes = "1.12.1"
masque-core = { version = "0.1.0", path = "../masque-core" }
masque-h2 = { version = "0.1.0", path = "../masque-h2" }
masque-h3 = { version = "0.1.0", path = "../masque-h3" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.54.1", features = ["net", "rt", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[package]
name = "masque-h3"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
bytes = "1.12.1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1.5.0"
masque-core = { version = "0.1.0", path = "../masque-core" }
quinn = "0.11.12"
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "sync"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
